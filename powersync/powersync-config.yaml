# yaml-language-server: $schema=https://unpkg.com/@powersync/service-sync-rules@latest/schema/sync_rules.json
replication:
  connections:
    - type: postgresql
      uri: !env PS_DATABASE_URL

      # SSL settings
      sslmode: disable # 'verify-full' (default) or 'verify-ca' or 'disable'

# Connection settings for sync bucket storage
storage:
  type: mongodb
  uri: mongodb://mongo:27017/powersync_demo

# The port which the PowerSync API server will listen on
port: !env PS_PORT
sync_config:
  path: sync-config.yaml

# Settings for client authentication
# Access tokens are issued by the backend (RS256), its public keys are served at /api/auth/jwks.json.
# While sessions opened with Keycloak are being migrated, production must also accept them:
#   jwks_uri: [!env PS_JWKS_URI, https://<keycloak>/realms/<realm>/protocol/openid-connect/certs]
#   audience: ["patrinotes", "account"]
client_auth:
  jwks_uri: !env PS_JWKS_URI
  audience: ["patrinotes"]

  # Settings for telemetry reporting
  # See https://docs.powersync.com/self-hosting/telemetry
  telemetry:
    # Opt out of reporting anonymized usage metrics to PowerSync telemetry service
    disable_telemetry_sharing: false
